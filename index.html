<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostor Hunt - PLN Nusantara Power</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { 
            QrCode, ShieldAlert, Trophy, Utensils, Users, MapPin, Play, Pause, 
            RefreshCw, CheckCircle2, XCircle, AlertTriangle, Search, Lock, Unlock, 
            Key, Eye, EyeOff, Database, Server, Cpu, FileText, Check, Award, 
            Sparkles, Smartphone, Monitor, Sparkle, FastForward, Info, Logout, Printer
        } = lucide;

        // --- GLOBAL INITIAL GAME CONSTANTS & SEED DATA (18 Teams) ---
        const ANIMAL_KEYWORDS = ["TIKUS", "GAJAH", "BADAK", "SINGA", "PANDA", "ZEBRA", "ELANG", "SEMUT", "LEBAH", "KATAK", "MACAN", "CICAK", "BEBEK", "BELUT", "KODOK", "TAPIR", "LUWAK", "KANCIL"];
        const COLORS_CONFIG = [
            { id: 'MERAH', name: 'MERAH', hex: '#EF4444', border: 'border-red-500', bg: 'bg-red-500', text: 'text-red-500', isCitizen: true },
            { id: 'BIRU', name: 'BIRU', hex: '#3B82F6', border: 'border-blue-500', bg: 'bg-blue-500', text: 'text-blue-500', isCitizen: true },
            { id: 'HIJAU', name: 'HIJAU', hex: '#10B981', border: 'border-green-500', bg: 'bg-green-500', text: 'text-green-500', isCitizen: true },
            { id: 'KUNING', name: 'KUNING', hex: '#F59E0B', border: 'border-yellow-500', bg: 'bg-yellow-500', text: 'text-yellow-500', isCitizen: true },
            { id: 'UNGU', name: 'UNGU', hex: '#8B5CF6', border: 'border-purple-500', bg: 'bg-purple-500', text: 'text-purple-500', isCitizen: true },
            { id: 'ORANGE', name: 'ORANGE', hex: '#F97316', border: 'border-orange-500', bg: 'bg-orange-500', text: 'text-orange-500', isCitizen: false }
        ];

        const LOCATIONS_DATA = Array.from({ length: 18 }, (_, i) => ({
            code: `QR-LOC-${(i + 1).toString().padStart(2, '0')}`,
            name: `Wahana TSB Zone ${(i + 1)}`,
            locationId: `LOC-${(i + 1).toString().padStart(2, '0')}`
        }));

        const generateInitialTeams = () => Array.from({ length: 18 }, (_, idx) => ({
            id: `TEAM-${(idx + 1).toString().padStart(2, '0')}`,
            name: `Tim Power ${idx + 1}`,
            batchId: 1,
            keyword: ANIMAL_KEYWORDS[idx % ANIMAL_KEYWORDS.length],
            membersCount: 8,
            departmentCount: 4
        }));

        const generateInitialPlayers = (teams) => teams.map((team, idx) => {
            const colorObj = COLORS_CONFIG[idx % 6];
            const loc = LOCATIONS_DATA[idx % LOCATIONS_DATA.length];
            return {
                id: `QR-PLY-B1-${(idx + 1)}`,
                teamId: team.id,
                teamName: team.name,
                colorId: colorObj.id,
                locationId: loc.locationId,
                locationName: loc.name,
                locationCode: loc.code,
                status: 'READY'
            };
        });

        const buildTeamPuzzleMapping = (teamId, keyword, impostorColorId) => {
            const citizenColors = COLORS_CONFIG.filter(c => c.id !== impostorColorId);
            const letters = keyword.split('');
            const clues = {};
            citizenColors.forEach((color, idx) => { clues[color.id] = letters[idx] || 'X'; });
            const decoyLetters = ['A', 'B', 'X', 'Z', 'M', 'Q'];
            clues[impostorColorId] = decoyLetters[Math.floor(Math.random() * decoyLetters.length)];
            return { teamId, keyword, impostorColorId, clues };
        };

        function App() {
            const [gameState, setGameState] = useState('PLAYING');
            const [viewMode, setViewMode] = useState('PARTICIPANT');
            const [activeTabAdmin, setActiveTabAdmin] = useState('OVERVIEW');
            const [mobileScreen, setMobileScreen] = useState('INTRO');
            const [selectedTeamId, setSelectedTeamId] = useState('TEAM-01');
            
            const teams = useMemo(() => generateInitialTeams(), []);
            const players = useMemo(() => generateInitialPlayers(teams), [teams]);
            const [impostorColorId, setImpostorColorId] = useState('ORANGE');
            
            const [teamPuzzles, setTeamPuzzles] = useState(() => {
                const map = {};
                teams.forEach(t => { map[t.id] = buildTeamPuzzleMapping(t.id, t.keyword, 'ORANGE'); });
                return map;
            });

            const [scannedPlayers, setScannedPlayers] = useState({});
            const [scannedClues, setScannedClues] = useState({});
            const [submissions, setSubmissions] = useState({});
            const [vouchers, setVouchers] = useState({});
            const [auditLogs, setAuditLogs] = useState([
                { id: 'LOG-001', time: new Date().toLocaleTimeString(), action: 'SYSTEM_INIT', details: 'Impostor Hunt initialized for Trans Studio Cibubur.' }
            ]);
            const [scanResultModal, setScanResultModal] = useState(null);
            const [inputKeyword, setInputKeyword] = useState('');
            const [selectedImpostorGuess, setSelectedImpostorGuess] = useState('ORANGE');
            const [showConfirmSubmitModal, setShowConfirmSubmitModal] = useState(false);

            const activeTeam = teams.find(t => t.id === selectedTeamId) || teams[0];

            const addAuditLog = (action, details) => {
                setAuditLogs(prev => [{ id: `LOG-${Date.now().toString().slice(-4)}`, time: new Date().toLocaleTimeString(), action, details }, ...prev]);
            };

            const handleFinalSubmission = () => {
                const cleanKeyword = inputKeyword.trim().toUpperCase();
                const teamPuzzle = teamPuzzles[activeTeam.id];
                const isKeywordCorrect = cleanKeyword === teamPuzzle.keyword;
                const isImpostorCorrect = selectedImpostorGuess === teamPuzzle.impostorColorId;
                const isBothCorrect = isKeywordCorrect && isImpostorCorrect;
                const submissionTime = new Date().toLocaleTimeString();

                setSubmissions(prev => ({
                    ...prev,
                    [activeTeam.id]: { submitted: true, submissionTime, keywordAns: cleanKeyword, impostorAns: selectedImpostorGuess, isCorrect: isBothCorrect }
                }));

                const newVouchers = { ...vouchers };
                for (let i = 1; i <= activeTeam.membersCount; i++) {
                    newVouchers[`VCH-${activeTeam.id}-${i}`] = {
                        id: `VCH-${activeTeam.id}-${i}`,
                        participantName: `Peserta ${i} (${activeTeam.name})`,
                        teamId: activeTeam.id,
                        redeemed: false,
                        redeemedAt: null,
                        manualOverride: false
                    };
                }
                setVouchers(newVouchers);
                addAuditLog('FINAL_SUBMISSION', `${activeTeam.name} submitted final answers.`);
                setShowConfirmSubmitModal(false);
                setMobileScreen('COMPLETED');
            };

            const processQrScanToken = (rawToken) => {
                if (gameState !== 'PLAYING') return { type: 'ERROR', title: 'GAME DIBEKUKAN', desc: 'Game Master belum memulai permainan.' };
                
                const matchedPlayer = players.find(p => p.id === rawToken);
                if (matchedPlayer) {
                    setScannedPlayers(prev => ({
                        ...prev,
                        [activeTeam.id]: Array.from(new Set([...(prev[activeTeam.id] || []), matchedPlayer.colorId]))
                    }));
                    addAuditLog('PLAYER_SCANNED', `${activeTeam.name} scanned player color ${matchedPlayer.colorId}`);
                    return {
                        type: 'PLAYER',
                        title: `PEMAIN ${matchedPlayer.colorId} DITEMUKAN!`,
                        color: matchedPlayer.colorId,
                        locationName: matchedPlayer.locationName,
                        locationCode: matchedPlayer.locationCode
                    };
                }

                const matchedLoc = LOCATIONS_DATA.find(l => l.code === rawToken);
                if (matchedLoc) {
                    const assignedPlayer = players.find(p => p.teamId === activeTeam.id && p.locationId === matchedLoc.locationId);
                    if (!assignedPlayer) {
                        return { type: 'ERROR', title: 'LOKASI TIDAK VALID', desc: 'Lokasi ini bukan tujuan tim Anda.' };
                    }
                    const hasFoundPlayer = (scannedPlayers[activeTeam.id] || []).includes(assignedPlayer.colorId);
                    if (!hasFoundPlayer) {
                        return { type: 'ERROR', title: 'BELUM MEMINDAI PEMAIN', desc: `Cari dan pindai pemain ${assignedPlayer.colorId} terlebih dahulu!` };
                    }

                    const teamPuzzle = teamPuzzles[activeTeam.id];
                    const letter = teamPuzzle.clues[assignedPlayer.colorId];
                    
                    setScannedClues(prev => ({
                        ...prev,
                        [activeTeam.id]: { ...(prev[activeTeam.id] || {}), [assignedPlayer.colorId]: letter }
                    }));
                    addAuditLog('CLUE_COLLECTED', `${activeTeam.name} collected clue for ${assignedPlayer.colorId}: ${letter}`);
                    return {
                        type: 'CLUE',
                        title: 'CLUE DISCOVERED!',
                        color: assignedPlayer.colorId,
                        letter: letter
                    };
                }

                return { type: 'ERROR', title: 'QR TIDAK DIKENALI', desc: 'Kode QR tidak terdaftar.' };
            };

            const leaderboard = useMemo(() => {
                return Object.entries(submissions).map(([tId, sub]) => {
                    const teamObj = teams.find(t => t.id === tId);
                    return { teamId: tId, teamName: teamObj?.name || tId, ...sub };
                }).filter(item => item.isCorrect).sort((a, b) => a.submissionTime.localeCompare(b.submissionTime));
            }, [submissions, teams]);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="bg-red-600 p-2 rounded-xl font-black tracking-wider flex items-center gap-2 shadow-lg shadow-red-600/30">
                                <ShieldAlert className="w-6 h-6 text-white" />
                                <span className="text-white text-lg">IMPOSTOR HUNT</span>
                            </div>
                            <span className="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-medium border border-slate-700">PLN Nusantara Power • Trans Studio Cibubur</span>
                        </div>
                        <div className="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                            <button onClick={() => setViewMode('PARTICIPANT')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'PARTICIPANT' ? 'bg-red-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                <Smartphone className="w-4 h-4" /> HP Peserta
                            </button>
                            <button onClick={() => setViewMode('ADMIN')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'ADMIN' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                <Monitor className="w-4 h-4" /> Dashboard Admin
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full">
                        {viewMode === 'PARTICIPANT' ? (
                            <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[750px]">
                                <div className="bg-slate-800/80 backdrop-blur p-4 border-b border-slate-700 flex justify-between items-center">
                                    <div>
                                        <h2 className="font-black text-white text-sm tracking-wide">{activeTeam.name}</h2>
                                        <p className="text-[10px] text-red-400 font-semibold">Batch 1 • 18 Tim Aktif</p>
                                    </div>
                                    <select value={selectedTeamId} onChange={(e) => setSelectedTeamId(e.target.value)} className="bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-2.5 py-1.5 outline-none font-medium">
                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                </div>

                                <div className="flex-1 p-5 flex flex-col justify-between overflow-y-auto">
                                    {mobileScreen === 'INTRO' && (
                                        <div className="text-center space-y-6 my-auto">
                                            <div className="w-20 h-20 bg-red-600/20 border-2 border-red-500 rounded-3xl mx-auto flex items-center justify-center shadow-xl shadow-red-500/10 animate-pulse">
                                                <Users className="w-10 h-10 text-red-500" />
                                            </div>
                                            <div className="space-y-2">
                                                <h1 className="text-2xl font-black text-white">IMPOSTOR HUNT</h1>
                                                <p className="text-xs text-slate-400 max-w-xs mx-auto leading-relaxed">Cari 6 pemain berwarnamu, temukan clue lokasi di Trans Studio Cibubur, pecahkan animal keyword, dan ungkap sang Impostor!</p>
                                            </div>
                                            <button onClick={() => setMobileScreen('DASHBOARD')} className="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-red-600/30 transition-all text-sm tracking-wider">
                                                MULAI BERBURU 🚀
                                            </button>
                                        </div>
                                    )}

                                    {mobileScreen === 'DASHBOARD' && (
                                        <div className="space-y-5">
                                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                                <div>
                                                    <span className="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Status Misi Tim</span>
                                                    <h3 className="text-base font-black text-white">{activeTeam.name}</h3>
                                                </div>
                                                <button onClick={() => setMobileScreen('SCANNER')} className="bg-red-600 hover:bg-red-500 text-white px-4 py-2.5 rounded-xl text-xs font-black flex items-center gap-2 shadow-lg shadow-red-600/20 transition-all">
                                                    <QrCode className="w-4 h-4" /> SCAN QR
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-2 gap-3">
                                                {COLORS_CONFIG.map(col => {
                                                    const hasPlayer = (scannedPlayers[activeTeam.id] || []).includes(col.id);
                                                    const clueLetter = (scannedClues[activeTeam.id] || {})[col.id];
                                                    return (
                                                        <div key={col.id} className={`p-3.5 rounded-2xl border transition-all ${hasPlayer ? 'bg-slate-800/80 border-slate-700' : 'bg-slate-950/40 border-slate-900 opacity-60'}`}>
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-xs font-black" style={{ color: col.hex }}>{col.name}</span>
                                                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${hasPlayer ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-500'}`}>
                                                                    {hasPlayer ? 'FOUND' : 'LOCKED'}
                                                                </span>
                                                            </div>
                                                            <div className="text-xs font-mono text-slate-300 font-bold mt-2 flex justify-between items-center">
                                                                <span>Clue:</span>
                                                                <span className="bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800 text-red-400 text-sm font-black">{clueLetter || '🔒'}</span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            <button onClick={() => setMobileScreen('FINAL')} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-blue-600/20 transition-all text-xs tracking-wider flex items-center justify-center gap-2">
                                                <Trophy className="w-4 h-4" /> MENU FINAL INVESTIGATION
                                            </button>
                                        </div>
                                    )}

                                    {mobileScreen === 'SCANNER' && (
                                        <div className="space-y-4 my-auto">
                                            <div className="text-center space-y-1">
                                                <h3 className="text-lg font-black text-white">SIMULATOR SCANNER QR</h3>
                                                <p className="text-xs text-slate-400">Pilih QR di bawah untuk simulasi scan kamera di Trans Studio Cibubur</p>
                                            </div>

                                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                                                <span className="text-[10px] font-bold text-slate-500 uppercase">Pilih QR Pemain:</span>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {players.filter(p => p.teamId === activeTeam.id).map(pl => (
                                                        <button key={pl.id} onClick={() => { const res = processQrScanToken(pl.id); setScanResultModal(res); }} className="p-2.5 bg-slate-900 hover:bg-slate-800 rounded-xl border border-slate-700 text-xs font-bold text-white transition-all flex flex-col items-center gap-1">
                                                            <span className="w-3 h-3 rounded-full" style={{ backgroundColor: COLORS_CONFIG.find(c => c.id === pl.colorId)?.hex }}></span>
                                                            {pl.colorId}
                                                        </button>
                                                    ))}
                                                </div>

                                                <span className="text-[10px] font-bold text-slate-500 uppercase block mt-3">Pilih QR Lokasi Utama:</span>
                                                <div className="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto">
                                                    {LOCATIONS_DATA.slice(0, 6).map(loc => (
                                                        <button key={loc.code} onClick={() => { const res = processQrScanToken(loc.code); setScanResultModal(res); }} className="p-2 bg-slate-900 hover:bg-slate-800 rounded-xl border border-slate-700 text-[10px] font-bold text-slate-300 transition-all">
                                                            {loc.name}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <button onClick={() => setMobileScreen('DASHBOARD')} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-all">
                                                Kembali ke Dashboard Misi
                                            </button>
                                        </div>
                                    )}

                                    {mobileScreen === 'FINAL' && (
                                        <div className="space-y-4 my-auto">
                                            <div className="text-center space-y-1">
                                                <h3 className="text-lg font-black text-white">FINAL INVESTIGATION</h3>
                                                <p className="text-xs text-slate-400">Masukkan 5 huruf animal keyword & tebak siapa impostornya.</p>
                                            </div>

                                            <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 block mb-1">Mission 1: Secret Animal (5 Huruf)</label>
                                                    <input type="text" maxLength="5" value={inputKeyword} onChange={(e) => setInputKeyword(e.target.value.toUpperCase())} placeholder="CONTOH: TIKUS" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono tracking-widest text-center uppercase text-sm outline-none font-black" />
                                                </div>

                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 block mb-1">Mission 2: Pilih Warna Impostor</label>
                                                    <select value={selectedImpostorGuess} onChange={(e) => setSelectedImpostorGuess(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-xs font-bold outline-none">
                                                        {COLORS_CONFIG.map(c => <option key={c.id} value={c.id}>Warna {c.name}</option>)}
                                                    </select>
                                                </div>

                                                <button onClick={() => setShowConfirmSubmitModal(true)} className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl shadow-lg shadow-red-600/30 transition-all text-xs tracking-wider mt-3">
                                                    SUBMIT FINAL ANSWER 🎯
                                                </button>
                                            </div>

                                            <button onClick={() => setMobileScreen('DASHBOARD')} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-all">
                                                Kembali
                                            </button>
                                        </div>
                                    )}

                                    {mobileScreen === 'COMPLETED' && (
                                        <div className="text-center space-y-5 my-auto">
                                            <div className="w-20 h-20 bg-emerald-500/20 border-2 border-emerald-500 rounded-3xl mx-auto flex items-center justify-center shadow-xl shadow-emerald-500/10">
                                                <CheckCircle2 className="w-10 h-10 text-emerald-500" />
                                            </div>
                                            <div className="space-y-2">
                                                <h1 className="text-xl font-black text-white">MISSION COMPLETED!</h1>
                                                <p className="text-xs text-slate-400 max-w-xs mx-auto leading-relaxed">Jawaban final telah tersimpan di server. Hak kupon makan Anda dan seluruh anggota tim telah diaktifkan!</p>
                                            </div>
                                            <button onClick={() => setMobileScreen('VOUCHER')} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-600/30 transition-all text-sm tracking-wider">
                                                BUKA KUPON MAKAN 🎟️
                                            </button>
                                        </div>
                                    )}

                                    {mobileScreen === 'VOUCHER' && (
                                        <div className="space-y-4 my-auto">
                                            <div className="text-center space-y-1">
                                                <h3 className="text-lg font-black text-white">VOUCHER MAKAN EKSKLUSIF</h3>
                                                <p className="text-xs text-slate-400">Tunjukkan QR ini ke tenant kuliner Trans Studio Cibubur</p>
                                            </div>

                                            <div className="bg-slate-950 p-6 rounded-3xl border border-slate-800 text-center space-y-4">
                                                <div className="w-32 h-32 bg-white rounded-2xl mx-auto p-2 flex items-center justify-center shadow-lg">
                                                    <QrCode className="w-28 h-28 text-slate-950" />
                                                </div>
                                                <div>
                                                    <h4 className="font-black text-white text-sm">Peserta 1 ({activeTeam.name})</h4>
                                                    <p className="text-[10px] text-slate-400 font-mono">Voucher ID: VCH-{activeTeam.id}-1</p>
                                                </div>
                                                <span className="inline-block bg-emerald-500/20 text-emerald-400 text-xs font-black px-4 py-1.5 rounded-full border border-emerald-500/30">
                                                    STATUS: AKTIF & SIAP DITUKAR
                                                </span>
                                            </div>

                                            <button onClick={() => setMobileScreen('DASHBOARD')} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition-all">
                                                Kembali ke Dashboard
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="flex flex-wrap gap-2 bg-slate-900 p-2 rounded-2xl border border-slate-800">
                                    {['OVERVIEW', 'PLAYERS', 'LOCATIONS', 'PUZZLES', 'MONITORING', 'LEADERBOARD', 'VOUCHERS', 'PRINTABLE', 'LOGS'].map(tab => (
                                        <button key={tab} onClick={() => setActiveTabAdmin(tab)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTabAdmin === tab ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </div>

                                {activeTabAdmin === 'OVERVIEW' && (
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-1">
                                            <span className="text-xs text-slate-400 font-bold">Total Tim (Batch 1)</span>
                                            <h3 className="text-3xl font-black text-white">18 Tim</h3>
                                        </div>
                                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-1">
                                            <span className="text-xs text-slate-400 font-bold">Total Peserta Aktif</span>
                                            <h3 className="text-3xl font-black text-blue-400">~144 Orang</h3>
                                        </div>
                                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-1">
                                            <span className="text-xs text-slate-400 font-bold">Tim Selesai Misi</span>
                                            <h3 className="text-3xl font-black text-emerald-400">{Object.keys(submissions).length} Tim</h3>
                                        </div>
                                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-1">
                                            <span className="text-xs text-slate-400 font-bold">Voucher Diaktifkan</span>
                                            <h3 className="text-3xl font-black text-orange-400">{Object.keys(vouchers).length} Vouchers</h3>
                                        </div>
                                    </div>
                                )}

                                {activeTabAdmin === 'PRINTABLE' && (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h3 className="text-lg font-black text-white">Pusat Cetak QR Code Fisik</h3>
                                                <p className="text-xs text-slate-400">Unduh dan cetak QR Code untuk ditempel di Trans Studio Cibubur.</p>
                                            </div>
                                            <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-xs font-black flex items-center gap-2 shadow-lg">
                                                <Printer className="w-4 h-4" /> Cetak Lembar QR
                                            </button>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {players.slice(0, 6).map(pl => (
                                                <div key={pl.id} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col items-center text-center space-y-2">
                                                    <span className="text-xs font-bold" style={{ color: COLORS_CONFIG.find(c => c.id === pl.colorId)?.hex }}>Pemain Warna {pl.colorId}</span>
                                                    <div className="bg-white p-2 rounded-xl">
                                                        <QrCode className="w-24 h-24 text-slate-950" />
                                                    </div>
                                                    <span className="text-[10px] text-slate-400 font-mono">ID: {pl.id}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTabAdmin === 'LEADERBOARD' && (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                                        <h3 className="text-lg font-black text-white">Leaderboard Juara (Top 3)</h3>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs">
                                                <thead>
                                                    <tr className="border-b border-slate-800 text-slate-400">
                                                        <th className="pb-3">Rank</th>
                                                        <th className="pb-3">Nama Tim</th>
                                                        <th className="pb-3">Keyword</th>
                                                        <th className="pb-3">Impostor</th>
                                                        <th className="pb-3">Waktu Submit</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {leaderboard.length === 0 ? (
                                                        <tr><td colSpan="5" className="py-6 text-center text-slate-500">Belum ada tim yang menyelesaikan misi dengan benar.</td></tr>
                                                    ) : (
                                                        leaderboard.map((item, idx) => (
                                                            <tr key={item.teamId} className="font-bold text-white">
                                                                <td className="py-3">#{idx + 1}</td>
                                                                <td className="py-3">{item.teamName}</td>
                                                                <td className="py-3 font-mono text-emerald-400">{item.keywordAns}</td>
                                                                <td className="py-3">{item.impostorAns}</td>
                                                                <td className="py-3 font-mono text-slate-400">{item.submissionTime}</td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {activeTabAdmin === 'MONITORING' && (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                                        <h3 className="text-lg font-black text-white">Live 18-Team Progress Matrix</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            {teams.map(t => (
                                                <div key={t.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                                                    <div>
                                                        <h4 className="font-black text-white text-xs">{t.name}</h4>
                                                        <span className="text-[10px] text-slate-500 font-mono">Keyword: {t.keyword}</span>
                                                    </div>
                                                    <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold ${submissions[t.id]?.submitted ? 'bg-emerald-500/20 text-emerald-400' : 'bg-blue-500/20 text-blue-400'}`}>
                                                        {submissions[t.id]?.submitted ? 'COMPLETED' : 'HUNTING'}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTabAdmin === 'LOGS' && (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                                        <h3 className="text-lg font-black text-white">Audit Trail & Server Logs</h3>
                                        <div className="space-y-2 font-mono text-xs">
                                            {auditLogs.map(log => (
                                                <div key={log.id} className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between">
                                                    <span className="text-blue-400">[{log.time}] {log.action}</span>
                                                    <span className="text-slate-400">{log.details}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {scanResultModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full text-center space-y-4 shadow-2xl">
                                <div className="w-16 h-16 bg-blue-600/20 rounded-full mx-auto flex items-center justify-center text-blue-500 font-black text-xl">
                                    QR
                                </div>
                                <h3 className="text-lg font-black text-white">{scanResultModal.title}</h3>
                                {scanResultModal.type === 'PLAYER' && (
                                    <p className="text-xs text-slate-300">Lokasi Tujuan: <strong className="text-white">{scanResultModal.locationName}</strong></p>
                                )}
                                {scanResultModal.type === 'CLUE' && (
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                        <span className="text-xs text-slate-400 block">Secret Letter:</span>
                                        <span className="text-3xl font-black text-red-500 font-mono">{scanResultModal.letter}</span>
                                    </div>
                                )}
                                {scanResultModal.type === 'ERROR' && (
                                    <p className="text-xs text-red-400">{scanResultModal.desc}</p>
                                )}
                                <button onClick={() => setScanResultModal(null)} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-xl text-xs">
                                    TUTUP
                                </button>
                            </div>
                        </div>
                    )}

                    {showConfirmSubmitModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full text-center space-y-4 shadow-2xl">
                                <AlertTriangle className="w-12 h-12 text-yellow-500 mx-auto" />
                                <h3 className="text-lg font-black text-white">Yakin Ingin Submit Final?</h3>
                                <p className="text-xs text-slate-400">Jawaban final tidak dapat diubah setelah dikirim ke server.</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConfirmSubmitModal(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl text-xs font-bold">
                                        Batal
                                    </button>
                                    <button onClick={handleFinalSubmission} className="flex-1 bg-red-600 hover:bg-red-500 text-white py-3 rounded-xl text-xs font-black">
                                        Ya, Kirim
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
